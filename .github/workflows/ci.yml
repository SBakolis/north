name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  cross-build:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o north-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/north

  fresh-install:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Build release-style binary
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/north" ./cmd/north
      - name: Exercise clean user installation
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nprintf "opencode fixture\\n"\n' > "$RUNNER_TEMP/bin/opencode"
          chmod 0755 "$RUNNER_TEMP/bin/opencode"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export HOME="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state"
          export XDG_CACHE_HOME="$HOME/.cache"
          "$RUNNER_TEMP/north" install --non-interactive
          "$RUNNER_TEMP/north" status
          "$RUNNER_TEMP/north" uninstall
