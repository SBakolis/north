name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: sh -n install.sh tests/install.sh
      - name: Test installation
        run: sh tests/install.sh
